<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MECSware Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .logo {
      max-height: 120px;
    }
    .buttonRobots, .buttonEchoring {
      width: 140px;
    }
    .status-box {
      min-width: 60px;
      text-align: center;
      padding: 0.4rem 0.75rem;
      border-radius: 0.375rem;
    }
    .input-group-text.label {
      width: 100px;
      justify-content: center;
    }
    .input-group-text.unit {
      width: 60px;
      justify-content: center;
    }
    .narrow-select {
      max-width: 180px;
    }
    .ip-input, .port-input {
      max-width: 100px;
    }
    .name-input {
      max-width: 400px;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="row align-items-start mb-4">
    <!-- Left Column: Configuration Inputs -->
    <div class="col-lg-6">
      <div class="input-group mb-2">
        <span class="input-group-text label">IP Address</span>
        <input id="ip" class="form-control ip-input" placeholder="IP Address" value="10.0.1.2">
      </div>
      <div class="input-group mb-2">
        <span class="input-group-text label">Port</span>
        <input id="port" class="form-control port-input" placeholder="Port" value="6327">
      </div>
      <div class="input-group mb-2">
        <span class="input-group-text label">Name</span>
        <select id="name" class="form-select name-input">
          <option selected disabled>Select Base Station</option>
          <option>BS5</option>
          <option>BS6</option>
        </select>
      </div>
      <div class="input-group mb-2">
        <span class="input-group-text label">Frequency</span>
        <select id="freq" class="form-select narrow-select">
          <option selected disabled>Pick Frequency</option>
          <option>3710</option><option>3720</option>
        </select>
        <span class="input-group-text unit">MHz</span>
      </div>
      <div class="input-group mb-2">
        <span class="input-group-text label">Bandwidth</span>
        <select id="bw" class="form-select narrow-select">
          <option selected disabled>Pick Bandwidth</option>
          <option>20</option><option>40</option>
        </select>
        <span class="input-group-text unit">MHz</span>
      </div>
      <div class="input-group mb-2">
        <span class="input-group-text label">Ratio</span>
        <select id="ratio" class="form-select narrow-select">
          <option selected disabled>Pick Ratio</option>
          <option>7:3</option><option>4:1</option>
        </select>
        <span class="input-group-text unit" style="visibility:hidden;">TDD</span>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text label">Power</span>
        <select id="power" class="form-select narrow-select">
          <option selected disabled>Pick Power</option>
          <option>0</option><option>10</option><option>20</option>
        </select>
        <span class="input-group-text unit">dBm</span>
      </div>
      <div class="d-flex gap-2 mb-2">
        <button class="btn btn-outline-primary btn-sm testPing">Test Connection</button>
        <button class="btn btn-outline-success btn-sm getData">Get Data</button>
      </div>
    </div>

    <!-- Right Column: Cards -->
    <div class="col-lg-6 d-flex flex-column flex-md-row gap-3">
      <!-- Robot Card -->
      <div id="robotCard" class="card shadow-sm w-100">
        <div class="card-body p-3">
          <h6 class="card-title mb-3 text-center">Robot Control</h6>
          <div class="d-flex flex-column align-items-center gap-2">
            <div class="d-flex gap-2">
              <button class="btn btn-outline-warning btn-sm fw-bold buttonRobots" onclick="Call_S1()">Call S1</button>
              <button class="btn btn-outline-secondary btn-sm fw-bold buttonRobots" onclick="Call_S2()">Call S2</button>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-secondary btn-sm fw-bold buttonRobots" onclick="S2_Auto_OFF()">S2 Auto OFF</button>
              <button class="btn btn-outline-secondary btn-sm fw-bold buttonRobots" onclick="S2_Auto_ON()">S2 Auto ON</button>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-secondary btn-sm fw-bold buttonRobots" onclick="S1_Route1()">S1 Route 1</button>
              <button class="btn btn-outline-secondary btn-sm fw-bold buttonRobots" onclick="COOP_Route()">COOP Route</button>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-secondary btn-sm fw-bold buttonRobots" onclick="S2_Route2()">S2 Route 2</button>
              <button class="btn btn-outline-secondary btn-sm fw-bold invisible">Placeholder</button>
            </div>
          </div>
          <div class="d-flex align-items-center gap-2 mt-2">
            <div class="text-muted small fw-bold">Predicted Network Load:</div>
            <div id="robotStatus" class="status-box bg-secondary text-white">--</div>
          </div>
          <div class="input-group input-group-sm mt-2">
            <select id="robotTopic" class="form-select">
              <option value="/callS1">/callS1</option>
              <option value="/callS2">/callS2</option>
            </select>
            <input id="robotTopicMsg" class="form-control" readonly>
          </div>
        </div>
      </div>

      <!-- EchoRing Card -->
      <div id="echoringCard" class="card shadow-sm w-100">
        <div class="card-body p-3">
          <h6 class="card-title mb-3 text-center">EchoRing Control</h6>
          <div class="d-flex flex-column align-items-center gap-2">
            <button class="btn btn-outline-warning btn-sm fw-bold buttonEchoring" onclick="echoOFF()">EchoRing OFF</button>
            <button class="btn btn-outline-secondary btn-sm fw-bold buttonEchoring" onclick="echoON()">EchoRing ON</button>
            <div class="d-flex align-items-center gap-2 mt-2">
              <div class="text-muted small fw-bold">Current TX:</div>
              <div id="echoringStatus" class="status-box bg-secondary text-white">--</div>
            </div>
            <div class="input-group input-group-sm mt-2">
              <select id="echoringTopic" class="form-select">
                <option value="/echoringfeedback">/echoringfeedback</option>
              </select>
              <input id="echoringTopicMsg" class="form-control" readonly>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Dummy JS functions to avoid console errors -->
<script>
  function Call_S1() { alert('Call S1'); }
  function Call_S2() { alert('Call S2'); }
  function S2_Auto_OFF() { alert('S2 Auto OFF'); }
  function S2_Auto_ON() { alert('S2 Auto ON'); }
  function S1_Route1() { alert('S1 Route 1'); }
  function COOP_Route() { alert('COOP Route'); }
  function S2_Route2() { alert('S2 Route 2'); }
  function echoOFF() { alert('Echo OFF'); }
  function echoON() { alert('Echo ON'); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
